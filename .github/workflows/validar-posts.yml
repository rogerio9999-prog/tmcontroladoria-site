# Em todo Pull Request (fila de revisão dos posts), confere se o site gera sem erros.
name: Validar posts

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py --rascunhos
