# Gera o site com build.py e publica no GitHub Pages.
# Roda a cada push na main e todo dia às 06:00 (Brasília), para liberar posts agendados com data futura.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 9 * * *"   # 06:07 em Brasília (minuto quebrado: o GitHub atrasa agendamentos na virada da hora)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Site publicado na raiz de tmcontroladoria.com.br. Para publicar numa subpasta,
      # defina a variável BASE_PATH (ex.: BASE_PATH: /subpasta).
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.tentativa1.outputs.page_url || steps.tentativa2.outputs.page_url || steps.tentativa3.outputs.page_url }}
    # O GitHub Pages às vezes devolve erro passageiro (502). Tenta até 3 vezes antes de desistir.
    steps:
      - id: tentativa1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.tentativa1.outcome == 'failure'
        run: sleep 120
      - id: tentativa2
        if: steps.tentativa1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.tentativa2.outcome == 'failure'
        run: sleep 300
      - id: tentativa3
        if: steps.tentativa2.outcome == 'failure'
        uses: actions/deploy-pages@v4
